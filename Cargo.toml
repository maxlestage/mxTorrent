[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/tracker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Maxime Lestage"]
license = "MIT"
repository = "https://github.com/maxlestage/mxTorrent"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package.mxtorrent-app]
opt-level = "s"
