[package]
name = "mxtorrent-tracker"
description = "Un tracker WebSocket compatible WebTorrent, qui peut aussi servir le site et le client mxTorrent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "compression-gzip", "compression-br"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
