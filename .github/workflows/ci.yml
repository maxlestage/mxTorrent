name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (moteur et tracker)
        run: cargo clippy -p mxtorrent-core -p mxtorrent-tracker --all-targets -- -D warnings
      - name: Clippy (client WebAssembly)
        run: cargo clippy -p mxtorrent-app --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        run: cargo test -p mxtorrent-core -p mxtorrent-tracker -p mxtorrent-app

  e2e:
    name: Bout en bout (deux navigateurs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Construction, comme sur Heroku (heroku-build.sh)
        run: ./heroku-build.sh
      - name: Échange d'un fichier entre deux navigateurs
        run: |
          # La commande du Procfile, avec le port fourni comme le fait Heroku.
          # Transmission tourne sur la même machine : la passerelle doit accepter l'adresse locale.
          MXT_RELAY_ALLOW_PRIVATE=1 PORT=8000 bin/mxtorrent-tracker --static dist &
          sleep 1
          node tests/e2e.cjs http://localhost:8000
          # Le client doit aussi trouver seul le tracker du serveur qui le sert.
          AUTO_TRACKER=1 node tests/e2e.cjs http://localhost:8000
      - name: Transmission
        run: sudo apt-get update -q && sudo apt-get install -y -q transmission-daemon transmission-cli
      - name: Réseau BitTorrent classique (Transmission, trackers UDP et HTTP, passerelle chiffrée)
        run: |
          MXT_RELAY_ALLOW_PRIVATE=1 PORT=8001 bin/mxtorrent-tracker --static dist &
          sleep 1
          tests/classic.sh http://localhost:8001
